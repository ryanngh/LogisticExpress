<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lỗi - Logistic Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
<div class="container text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 p-4">
                <h1 class="display-4 text-danger fw-bold" th:text="${status} ?: '500'">500</h1>
                <h4 class="text-secondary mb-3" th:text="${errorCode} ?: 'ERROR'">ERROR</h4>
                <p class="text-muted mb-4" th:text="${message} ?: 'Đã có lỗi xảy ra. Vui lòng thử lại sau.'">Thông báo lỗi</p>
                <div>
                    <a href="/" class="btn btn-primary px-4">Về trang chủ</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
