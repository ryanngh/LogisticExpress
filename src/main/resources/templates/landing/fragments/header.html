<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header(isAuthenticated, currentUsername, dashboardUrl)" class="le-header">
    <div class="le-container le-header-inner">
        <a id="brand-link" href="#top" aria-label="Logistic Express, về đầu trang" class="le-brand">
            <span class="le-brand-badge">
                <i data-lucide="route" style="width:20px;height:20px;" aria-hidden="true"></i>
            </span>
            <span>Logistic Express</span>
        </a>

        <nav aria-label="Điều hướng chính" class="le-nav">
            <a href="#gioi-thieu">Giới thiệu</a>
            <a href="#he-sinh-thai">Theo dõi vận đơn</a>
            <a href="#bang-gia">Cước phí</a>
            <a href="#bang-gia">Bảng giá</a>
            <a href="#quy-trinh">Bưu cục</a>
            <a href="#faq">Hỗ trợ</a>
        </nav>

        <!-- Guest actions -->
        <div th:if="${isAuthenticated == null or !isAuthenticated}" class="d-flex flex-wrap align-items-center gap-2">
            <a id="login-button"
               th:href="@{/login}"
               data-open-auth="signin"
               class="le-btn le-btn-secondary">
                <span>Đăng nhập</span>
            </a>
            <a id="register-button"
               th:href="@{/register}"
               data-open-auth="signup"
               class="le-btn le-btn-primary">
                <span>Đăng kí</span>
            </a>
        </div>

        <!-- Authenticated actions -->
        <div th:if="${isAuthenticated != null and isAuthenticated}" class="d-flex flex-wrap align-items-center gap-2">
            <span class="le-user-pill">
                <i data-lucide="user-check" style="width:15px;height:15px;color:var(--le-primary);" aria-hidden="true"></i>
                <span th:text="${currentUsername}">user</span>
            </span>
            <a th:href="${dashboardUrl != null ? dashboardUrl : '/'}" class="le-btn le-btn-primary">
                <span>Bảng điều khiển</span>
            </a>
            <button type="button" data-logout-btn class="le-btn le-btn-tertiary">
                <i data-lucide="log-out" style="width:15px;height:15px;" aria-hidden="true"></i>
                <span>Đăng xuất</span>
            </button>
        </div>
    </div>
</header>
</body>
</html>
